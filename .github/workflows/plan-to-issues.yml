name: plan-to-issues

# Plan (viết bằng superpowers:writing-plans, bản ghim = PINNED_VERSION trong script) được MERGE vào main ⇒ raise 1 Epic + N Story.
# Merge trước = plan đã qua review trước khi sinh việc. Logic nằm trong scripts/plan-to-issues.py, không ở
# đây (CI chỉ gọi script). Chạy lại an toàn: Issue đã raise (marker ẩn) thì bỏ qua. Plan sai định dạng ⇒
# job ĐỎ, không tạo Issue nào. Xem GIT-FLOW.md § "Plan → Epic/Story".

on:
  push:
    branches: [main]
    paths: ["docs/superpowers/plans/**.md"]

permissions:
  contents: read
  issues: write

concurrency:
  group: plan-to-issues   # không chạy song song — tránh 2 run cùng raise một plan
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Raise epic/story cho các plan vừa đổi
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff-tree --root --no-commit-id --name-only --diff-filter=AM -r HEAD -- 'docs/superpowers/plans/*.md')"
          else
            # Plan đổi tên/di chuyển = đỏ: marker theo path ⇒ xử lý như plan mới sẽ raise TRÙNG epic/story.
            renamed="$(git diff --name-status -M --diff-filter=R "$BEFORE..HEAD" -- 'docs/superpowers/plans/*.md')"
            [ -z "$renamed" ] || { echo "::error::Plan bị đổi tên/di chuyển — không raise (sẽ trùng Issue). Hoàn nguyên tên cũ, hoặc viết plan mới:"; echo "$renamed"; exit 1; }
            changed="$(git diff --name-only -M --diff-filter=AM "$BEFORE..HEAD" -- 'docs/superpowers/plans/*.md')"
          fi
          [ -n "$changed" ] || { echo "Không có plan thêm/sửa (chỉ xoá?) — không raise gì."; exit 0; }
          printf '%s\n' "$changed" | while read -r plan; do
            echo "::group::$plan"
            python3 scripts/plan-to-issues.py "$plan"
            echo "::endgroup::"
          done
