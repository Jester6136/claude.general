name: check

# Cổng chất lượng TẦNG A — static + smoke thuần + test plumbing. Tầng B (cần GPU/LLM/DB sống, xem
# AGENT.md §4) KHÔNG chạy ở đây. Workflow này CHỈ gọi scripts/check.sh — không viết lại logic kiểm
# trong YAML (một nơi định nghĩa cổng, hai nơi gọi: máy dev + CI — xem GIT-FLOW.md).
#
# TODO trước khi dùng: điền bước "Cài dependency" đúng ngôn ngữ/gói của project, và điền các lệnh còn
# TODO trong scripts/check.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited: thêm `Closes #N` vào mô tả PR sau khi CI đã xanh vẫn phải chạy lại kiểm đơn vị nghiệm thu.
    types: [opened, synchronize, reopened, edited]

# `edited` làm mỗi lần sửa mô tả PR chạy lại — huỷ run cũ cùng PR để status hiển thị luôn là run mới nhất.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check.sh --all
    runs-on: ubuntu-latest
    # Runner hosted có giới hạn phút — chặn treo bằng timeout, không để job chạy vô hạn.
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # TODO: thay bước setup ngôn ngữ cho đúng project (setup-python / setup-node / …).
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip

      - name: Cài dependency
        id: deps
        run: |
          echo 'TODO: pip install -r requirements.txt (hoặc npm ci, v.v.)'

      - name: check.sh --all (static + smoke thuần + test plumbing)
        run: ./scripts/check.sh --all

      # Phán quyết nghiệm thu TẤT ĐỊNH (AGENT.md §4.2): N0 · N1 replay · chấm lại snapshot N2. Đơn vị exit 77
      # (không chạy được) = ĐỎ, flaky = ĐỎ, Issue được đóng mà thiếu đơn vị = ĐỎ. Không bao giờ gọi model
      # sống ở đây — sinh snapshot/record cassette là tầng B. Vẫn chạy khi --all đỏ (phán quyết luôn phải
      # hiện), nhưng KHÔNG chạy khi cài dependency hỏng (tránh đỏ dây chuyền che mất gốc rễ).
      # Việc tách số Issue từ PR_BODY nằm trong check.sh, không trong YAML. Body đi qua env, KHÔNG nội suy
      # ${{ }} thẳng vào script (tránh injection từ nội dung PR).
      - name: check.sh --acceptance (nghiệm thu tất định)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check.sh --acceptance
